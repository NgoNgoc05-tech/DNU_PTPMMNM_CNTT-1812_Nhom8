name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Kiểm thử (PHP ${{ matrix.php }} + PostgreSQL 16)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pinpoint_lab
          POSTGRES_PASSWORD: pinpoint_ci
          POSTGRES_DB: pinpoint_lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pinpoint_lab" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: pinpoint_lab
      PGUSER: pinpoint_lab
      PGPASSWORD: pinpoint_ci
    defaults:
      run:
        working-directory: Ma_nguon
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, gd, fileinfo, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp PHP
        run: find src public tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Kiểm tra môi trường và tạo CSDL mẫu
        run: |
          bash lab.sh check
          bash lab.sh setup
      - name: Kiểm thử đơn vị, JS, tích hợp, HTTP
        run: bash lab.sh test
      - name: Kiểm thử trên trình duyệt (2 tình huống + phép thử 1)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p .local/sessions
          php -d session.save_path=$PWD/.local/sessions -S 127.0.0.1:8115 -t public > /tmp/server.log 2>&1 &
          sleep 1
          node tests/e2e/browser.mjs
      - name: Lưu ảnh chụp kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-php${{ matrix.php }}
          path: Ma_nguon/tests/e2e/out
          if-no-files-found: ignore
